<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- bluxstudio-skill remix: an already-edited ad (new hook + new body) with the camel transitions at the joins and the
     user's assets animated IN FRONT of the speaker, just above the burned-in captions, in the body.
     Generated by remix_broll.py from a BEATS list; edit the beats, not this file.
     Motion of the assets: asset_motion.js (pasted in where the page says ASSET-MOTION). -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .camwrap { position: absolute; inset: 0; transform-origin: 50% 32%; }
  .camwrap video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #camA { z-index: 1; }
  #assets { z-index: 4; }
  #fx { position: absolute; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
  #flash { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen;
    background: radial-gradient(85% 60% at 50% 38%, rgb(255,240,205) 0%, rgb(255,205,120) 75%); }
  .sweep { position: absolute; top: -20%; left: 0; width: 520px; height: 140%; opacity: 0; mix-blend-mode: screen; filter: blur(18px);
    background: linear-gradient(90deg, rgba(255,214,120,0) 0%, rgba(255,226,160,.85) 45%, rgba(255,255,240,.95) 52%, rgba(255,214,120,0) 100%); }
</style>
</head>
<body>
<div id="root" data-composition-id="{{ID}}" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920" data-fps="30">
  <div id="camA" class="camwrap">
    <video id="v0" class="clip" src="assets/footage/main.mp4" data-start="0" data-duration="{{DUR}}" data-media-start="0"
      data-track-index="0" data-has-audio="true" playsinline></video>
  </div>
  <div id="assets"></div>
  <div id="fx"><div id="flash"></div><div class="sweep" id="sweep1"></div><div class="sweep" id="sweep2"></div></div>
{{AUDIO}}
</div>

<script>/*ASSET-MOTION*/</script>
<script>
  const ID = "{{ID}}";
  const DUR = {{DUR}};
  const T_BODY = {{T_BODY}};
  const T_CTA = {{T_CTA}};       // body -> CTA join (camel T2), or null when the CTA follows on in the same take
  const T_JUMPS = {{T_JUMPS}};   // jump cuts inside the hook: a cut-zoom 1.0 -> 1.06 makes them read as intentional
  const BEATS = {{BEATS}};       // the user's assets: {img, w, h, x, top, in, out, breathe?, shake?, keys?}

  const nodes = CamelAssets.mount(document.getElementById("assets"), BEATS);
  const tl = gsap.timeline({ paused: true });
  const cam = "#camA";

  // ---------- camel hook->body transition at the join ----------
  tl.set(cam, { scale: 1.0, filter: "blur(0px)", transformOrigin: "50% 32%" }, 0);
  tl.to(cam, { scale: 1.09, filter: "blur(7px)", duration: 0.20, ease: "power2.in" }, T_BODY - 0.20);
  tl.fromTo(cam, { scale: 1.09 }, { scale: 1.0, filter: "blur(0px)", duration: 0.46, ease: "expo.out", immediateRender: false }, T_BODY);
  tl.set("#sweep1", { rotation: 16 }, 0);
  tl.fromTo("#sweep1", { x: 1250, opacity: 0 }, { x: -760, opacity: 1, duration: 0.55, ease: "power2.inOut" }, T_BODY - 0.26);
  tl.to("#sweep1", { opacity: 0, duration: 0.10, ease: "none" }, T_BODY + 0.29);
  tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.42, duration: 0.06, ease: "none", immediateRender: false }, T_BODY - 0.04);
  tl.to("#flash", { opacity: 0, duration: 0.30, ease: "power2.out" }, T_BODY + 0.02);
  // jump cuts: within each section (hook / body / CTA) the 1st cut zooms in to 1.06, the 2nd back to 1.0, and so on
  const SECTIONS = [0, T_BODY].concat(T_CTA != null ? [T_CTA] : []);
  T_JUMPS.forEach((t) => {
    const s0 = Math.max(...SECTIONS.filter((x) => x <= t));
    const k = T_JUMPS.filter((j) => j > s0 && j <= t).length;
    tl.set(cam, { scale: k % 2 ? 1.06 : 1.0 }, t);
  });
  if (T_CTA != null) {
    // camel T2: punch + blur into the CTA, settle back to 1.0 so the burned-in CTA mockup is never cropped
    tl.to(cam, { scale: 1.09, filter: "blur(7px)", duration: 0.20, ease: "power2.in" }, T_CTA - 0.20);
    tl.fromTo(cam, { scale: 1.09 }, { scale: 1.0, filter: "blur(0px)", duration: 0.50, ease: "expo.out", immediateRender: false }, T_CTA);
    tl.set("#sweep2", { rotation: 16 }, 0);
    tl.fromTo("#sweep2", { x: -760, opacity: 0 }, { x: 1250, opacity: 1, duration: 0.55, ease: "power2.inOut", immediateRender: false }, T_CTA - 0.26);
    tl.to("#sweep2", { opacity: 0, duration: 0.10, ease: "none" }, T_CTA + 0.29);
    tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.50, duration: 0.06, ease: "none", immediateRender: false }, T_CTA - 0.04);
    tl.to("#flash", { opacity: 0, duration: 0.34, ease: "power2.out" }, T_CTA + 0.02);
  }

  // ---------- the user's assets ----------
  CamelAssets.animate(tl, BEATS, nodes);

  tl.set({}, {}, DUR);
  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
</script>
</body>
</html>
