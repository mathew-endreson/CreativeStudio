# Builds the Windows installer (BluxTech Studio_<version>_x64-setup.exe) on a GitHub-hosted Windows runner.
#
#   - "Run workflow" in the Actions tab builds it and keeps it as an artifact (90 days).
#   - Pushing a tag like v0.1.0 also attaches it to a GitHub release.
#
# The runner has Node, Python, Rust and the MSVC toolchain. installer\build.ps1 downloads the embedded Python, Node,
# HyperFrames and FFmpeg (cached between runs), stages everything and runs `tauri build`. The illustration library
# comes from assets-library/ in this repository; the Supabase config and the license public key are committed too
# (both hold public values). The matte model is not on the runner: the installed app's Setup screen fetches it with
# the first cutout warm-up instead.
name: installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the runtime downloads (Python, Node, FFmpeg, pip and npm packages)
        uses: actions/cache@v4
        with:
          path: installer/downloads
          key: runtime-downloads-${{ hashFiles('installer/build_runtime.ps1', 'installer/runtime-requirements.txt', 'engine/requirements.txt') }}

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the UI dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Pillow for the icon script
        run: pip install pillow

      - name: Build the installer
        run: .\installer\build.ps1 -LibraryDir (Join-Path $PWD "assets-library")

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: BluxTech-Studio-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Attach it to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
