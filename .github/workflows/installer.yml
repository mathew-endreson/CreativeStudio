# Builds the Windows installer (CreativeStudio_<version>_x64-setup.exe) on a GitHub-hosted Windows runner.
#
#   - "Run workflow" in the Actions tab builds it and keeps it as an artifact (90 days).
#   - Pushing a tag like v0.1.0 also attaches it to a GitHub release.
#
# The runner has Node, Python, Rust and the MSVC toolchain. installer\build.ps1 downloads the embedded Python, Node,
# HyperFrames and FFmpeg (cached between runs), stages everything and runs `tauri build`. No picture library is
# shipped (each PC fills its own from the Library screen); the Supabase config and the license public key are
# committed (both hold public values). The matte model is not on the runner: the installed app's Setup screen
# fetches it with the first cutout warm-up instead.
name: installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the runtime downloads (Python, Node, FFmpeg, pip and npm packages)
        uses: actions/cache@v4
        with:
          path: installer/downloads
          key: runtime-downloads-${{ hashFiles('installer/build_runtime.ps1', 'installer/runtime-requirements.txt', 'engine/requirements.txt') }}

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the UI dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Pillow for the icon script
        run: pip install pillow

      # a step's own env is not visible to its `if`, and `secrets` is not available there at all: check in the shell
      - name: The updater signing key must be in the repository secrets
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:SIGNING_KEY) {
            Write-Error "Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (Settings > Secrets and variables > Actions): the build signs the update artifact with them. See README, Updates."
            exit 1
          }
          if (-not $env:SIGNING_PASSWORD) { Write-Warning "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty: the key is expected to have no password." }
          Write-Output "signing key present ($($env:SIGNING_KEY.Length) characters)"

      - name: Build the installer (signed update artifact + latest.json)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .\installer\build.ps1 -Tag "${{ github.ref_name }}"

      - name: The release must carry the version the app was built with
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v$v")) { Write-Error "tag $tag does not match the app version $v (tauri.conf.json, Cargo.toml, package.json)"; exit 1 }

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: CreativeStudio-windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          compression-level: 0

      # A tag with a hyphen (v0.1.1-rc1, v0.1.1-test) is a pre-release: the app's release channel
      # (releases/latest/download/latest.json) never serves it; customers only see plain v* tags.
      - name: Attach it to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json
